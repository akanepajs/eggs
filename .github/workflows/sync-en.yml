name: sync-en

# Mirror the English page to eggs.kanepajs.eu. The source of truth is the public
# olas repo (https://github.com/akanepajs/olas). Its daily-scrape and deploy-pages
# workflows dispatch this one right after they deploy, passing the olas commit to
# publish; this job fetches index_en.html at that commit and republishes it here,
# so there is no second scrape.
#
# No schedule on purpose: GitHub disables scheduled workflows after 60 days with
# no commits to the repo (this one was off from 2026-08-21 to 2026-11-03), and a
# 06:00 cron ran before olas's delayed scrape, so the mirror lagged a day anyway.
# Dispatch needs the olas secret EGGS_DISPATCH_TOKEN (fine-grained PAT, this repo
# only, Actions: read and write); when it expires the olas runs fail loudly.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'olas commit SHA or branch to publish'
        required: false
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fetching by commit SHA sidesteps raw.githubusercontent.com's ~5-minute
      # cache of branch URLs, which would otherwise serve the pre-push page.
      - name: Fetch English page from the olas repo
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          mkdir -p site
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/akanepajs/olas/${REF}/index_en.html" -o site/index.html
          test -s site/index.html
          echo "eggs.kanepajs.eu" > site/CNAME
          : > site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
